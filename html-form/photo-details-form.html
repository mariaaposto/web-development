<!DOCTYPE html>
<html>
    <head lang="en">
        <meta charset="utf-8">  <!-- εντολή για να καθορίσω τη γλώσσα -->
        <link rel="stylesheet" href="reset.css"> 
    </head>
    
    <body>
        <form method="get" action="http://www.randyconnolly.com/tests/process.php"> <!-- έναρξη φόρμας με μέθοδο GET για τον ιστότοπο για σωστή έξοδο-->
            
            <fieldset>
                <legend>Photo Details</legend>
                <table> 
                    <tr> 
                        <td colspan="2"> <!-- αρχή κελιού πίνακα με συγχώνευση δύο στηλών -->
                            <p>
                                <label>Title</label><br>
                                <input type="text" name="title" size="80">
                            </p>
                            <p>
                                <label>Description</label><br/>
                                <textarea name="description" rows="7" cols="85"></textarea>
                            </p>
                        </td>
                    </tr>
                    
                    <tr> <!-- αρχή γραμμής πίνακα -->
                        <td> <!-- αρχή κελιού πίνακα -->
                            <p>
                                <label>Continent</label><br>
                                <select name="continent">
                                    <option>Choose continent</option>
                                    <option>Africa</option>
                                    <option>Asia</option>
                                    <option>Europe</option>
                                    <option>North America</option>
                                    <option>South America</option>
                                </select>
                            </p>
                            
                            <p>
                                <label>Country</label><br>
                                <select name="country">
                                    <option>Choose country</option>
                                    <option>Greece</option>
                                    <option>Cyprus</option>
                                    <option>England</option>
                                </select>
                            </p>
                            <p>
                                <label>City</label><br>
                                <input type="text" name="city" list="cities"  size="45">
                                <datalist id="cities">
                                    <option>Athens</option>
                                    <option>Nikosia</option>
                                    <option>London</option>
                                </datalist>
                            </p>
                        </td>
                        
                        <td>
                            <div class="rightBoxes">
                                <label>Copyright? </label><br>
                                <input type="radio" name="copyright" value="1">All rights reserved<br>
                                <input type="radio" name="copyright" value="2" checked>Creative Commons<br>
                            </div>
                            
                            <div class="rightBoxes">
                                <label>Creative Commons Types </label><br>
                                <input type="checkbox" name="cc" >Attribution<br>
                                <input type="checkbox" name="cc">Noncommercial <br>
                                <input type="checkbox" name="cc">No Derivative Works <br>
                                <input type="checkbox" name="cc">Share Alike
                            </div>
                        </td>
                    </tr>
                    
                    <tr>
                        <td colspan="2">
                            <div class="rec"> 
                                <label>I accept the software license</label>
                                <input type="checkbox" name="accept">
                            </div>
                        </td>
                    </tr>
                    
                    <tr>
                        <td>
                            <p>
                                <label>Rate this photo: <br>
                                    <input type="number" min="1" max="5" name="rate" >  
                                </label>
                            </p>                  
                            <p>
                                <label>Color Collection: <br>
                                    <input type="color"  name="color">   
                                </label>
                            </p>                  
                        </td>
                        <td>
                            <div class="rightBoxes">
                                <p>
                                    <label>Date Taken: <br>
                                        <input type="date"  name="date">   
                                    </label>
                                </p>
                                <p>
                                    <label>Time Taken: <br>
                                        <input type="time"  name="time">   
                                    </label>
                                </p>                  
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <div class="rec center"> <!-- αρχή περιοχής επιβεβαίωσης και επεξεργασίας -->
                                <input type="submit" class="round"> <input type="reset" value="Clear Form" class="round">      
                            </div>
                        </td>
                    </tr>
                </table>
            </fieldset>
        </form>
    </body>
</html>
